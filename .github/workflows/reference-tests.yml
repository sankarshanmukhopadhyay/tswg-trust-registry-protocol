name: Downstream reference-model tests

on:
  push:
    branches:
      - 'feat/verification-material-reference'
      - 'feat/wp*'
      - 'test/wp*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run baseline and reference-model tests
        run: node --test tests/*.test.js

      - name: Validate v3 RC readiness controls
        run: node scripts/validate-v3-readiness.mjs
